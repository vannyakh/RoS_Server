groups:
  - name: ros_server
    rules:
      - alert: GameTickOverrun
        expr: increase(ros_game_tick_overruns_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A game tick exceeded its interval.
      - alert: HttpErrors
        expr: sum(rate(ros_http_requests_total{status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx responses are being recorded.
